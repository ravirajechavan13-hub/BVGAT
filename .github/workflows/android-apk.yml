name: Build Android APK

# Har push par debug APK auto-build + download-ready artifact
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Android Gradle ke liye)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Gradle wrapper jar exists (fixes 'Unable to access jarfile')
        run: |
          cd android
          # Windows se commit hone par execute bit kho jaata hai — wapas lao
          chmod +x gradlew 2>/dev/null || true
          # Agar jar file repo me missing hai to Gradle 8.14.3 se download karo
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "⚠ gradle-wrapper.jar missing — downloading from Gradle v8.14.3..."
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar
          fi
          echo "Wrapper files:"
          ls -la gradle/wrapper/
          ls -la gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BVGAT-Sagar-Store-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
